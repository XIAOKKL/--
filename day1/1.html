<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录/注册</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family:"Microsoft YaHei", Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }
        header{
            text-align: center;
            padding:30px 0 10px;
            }
        header h1 {
            margin-bottom: 10px;
        }
        .line {
            width:80px;
            height: 4px;
            background-color:aqua;
            margin: 0 auto;
        }
        main{
            max-width:800px;
            margin: 20px auto;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }
        section {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size:20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="email"],
        input[type="password"],
        input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
       .checkbox-group {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        font-size: 14px;
        gap:6px;
       }
       button{
        width: 100%;
        padding:10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
       }
       button:hover {
        background-color: #45a049;
       }
       footer {
        text-align:center;
        padding: 20px 0;
        font-size: 14px;
        color:#666;
       }
    </style>
</head>
<body>
    <header>
        <h1>欢迎来到小王驿站</h1>
        <div class="line"></div>
    </header>
    <main>
        <!-- 登录/注册表单 -->
      <section>
        <h2>登录</h2>
        <form action="#" method="post">
            <div class="form-group">
               <label for="login-email">邮箱:</label>
               <input type="email" id="login-email" name="email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-group">
               <label for="login-password">密码:</label>
               <input type="password" id="login-password" name="login-password" placeholder="请输入密码" required>
            </div> 
            <button type="submit">登录</button>
        </form>
      </section>
      <section>
      <h2>注册</h2>
      <form action="#" method="post">
        <div class="form-group">
          <label for="reg-username">用户名:</label>
          <input type="text" id="reg-username" name="username" placeholder="请输入用户名" required>
        </div>
        <div class="form-group">
          <label for="reg-email">邮箱:</label>
          <input type="email" id="reg-email" name="email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-group">
          <label for="reg-password">密码:</label>
          <input type="password" id="reg-password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="form-group">
          <label for="reg-confirm">确认密码:</label>
          <input type="password" id="reg-confirm" name="confirm" placeholder="请再次输入密码" required>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="agree" name="agree" required>
          <label for="agree">同意用户协议</label>
        </div>
        <button type="submit">注册</button>
      </form>
    </section>
    </main>
    <footer>
    <p>© 2026 我们的网站. 保留所有权利.</p>
  </footer>
</body>
</html>
