<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小王驿站 - 响应式布局</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 导航栏 - Flex */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #37a0d8;
      color: #fff;
      padding: 12px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
    }

    nav a:hover {
      opacity: 0.85;
    }

    /* 主要内容 */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .hero p {
      color: #666;
      font-size: 16px;
    }

    /* 卡片区 - Grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 18px;
    }

    .card p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      flex: 1;
      margin-bottom: 16px;
    }

    .card button {
      align-self: flex-start;
      padding: 8px 16px;
      background-color: #37a0d8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .card button:hover {
      background-color: #2d8bc0;
    }

    /* 页脚 */
    footer {
      text-align: center;
      padding: 20px;
      background-color: #37a0d8;
      color: white;
      font-size: 14px;
    }

    /* 手机适配 */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }

      nav a {
        margin: 0 10px;
      }

      .hero h2 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">小王驿站</div>
    <nav>
      <a href="#">首页</a>

      <a href="#">服务</a>
      <a href="#">联系</a>
    </nav>

    <section class="hero">

    <section class="cards">

      <div class="card">
